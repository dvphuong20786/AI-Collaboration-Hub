name: Hub Issue #1 -> Slack (pilot)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-slack-relay-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  relay:
    # Only the 3 allowlisted logins relay (Muse, Jules, Owner); ChatGPT's bot
    # is not listed, which prevents Slack -> Work -> GitHub loops.
    # Only Hub Issue #1 and explicitly allowed participants.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 1 &&
        !github.event.issue.pull_request &&
        (
          github.event.comment.user.login == 'dvp-game1' ||
          github.event.comment.user.login == 'gemini-dvp-f3' ||
          github.event.comment.user.login == 'dvphuong20786'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Relay to Slack (no GitHub API calls)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Repository variable: Slack user ID of the ChatGPT app. The Owner
          # sets it (Settings -> Secrets and variables -> Actions -> Variables)
          # once the Slack app is installed; empty until then means no @mention.
          # Never invent an ID here.
          CHATGPT_SLACK_USER_ID: ${{ vars.CHATGPT_SLACK_USER_ID }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          url = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if not url:
              print("ERROR: SLACK_WEBHOOK_URL secret is not set. Failing the run "
                    "so the missing secret is visible instead of a false green.")
              sys.exit(1)

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          # Optional @mention of the ChatGPT Slack app, from the
          # CHATGPT_SLACK_USER_ID repository variable. Empty means no mention.
          mention_id = os.environ.get("CHATGPT_SLACK_USER_ID", "").strip()
          mention = f"<@{mention_id}> " if mention_id else ""

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              text = (
                  f"{mention}*AI Collaboration Hub test*\n"
                  "Manual test from GitHub Actions. Does this message launch a ChatGPT Work task?\n"
                  f"Run ID: {os.environ.get('GITHUB_RUN_ID', '')}"
              )
          else:
              comment = event["comment"]
              sender = comment["user"]["login"]
              comment_id = comment["id"]
              link = comment["html_url"]
              body = (comment.get("body") or "").strip().replace("\r", "")
              excerpt = body[:450] + ("…" if len(body) > 450 else "")
              # Escape for Slack mrkdwn so & < > in the comment render as text.
              excerpt = excerpt.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              text = (
                  f"{mention}*Hub Issue #1 — new comment from {sender}*\n"
                  f"<{link}|Read the GitHub comment>\n"
                  f"Comment ID: {comment_id}\n"
                  f"{excerpt}\n\n"
                  "For ChatGPT Work: read the linked Issue #1; respond on GitHub "
                  "only if a new response is needed. Never merge or edit main."
              )

          request_body = json.dumps({"text": text}, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(
              url, data=request_body,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if 200 <= response.status < 300:
                          print("Slack relay delivered. This does NOT prove Work was triggered.")
                          sys.exit(0)
                      raise RuntimeError(f"Slack returned status {response.status}")
              except urllib.error.HTTPError as err:
                  if err.code == 429 and attempt < 2:
                      retry_after = err.headers.get("Retry-After", "2")
                      try:
                          delay = max(1, min(25, int(retry_after)))
                      except ValueError:
                          delay = 2
                      print(f"Slack rate limited. Retrying after {delay}s.")
                      time.sleep(delay)
                      continue
                  if 500 <= err.code < 600 and attempt < 2:
                      time.sleep(2 ** attempt)
                      continue
                  raise RuntimeError(f"Slack HTTP status {err.code}") from None
              except urllib.error.URLError as err:
                  if attempt < 2:
                      time.sleep(2 ** attempt)
                      continue
                  raise RuntimeError(f"Slack network error: {err.reason}") from None

          PY
